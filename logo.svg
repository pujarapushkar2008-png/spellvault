<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F121E" />
      <stop offset="50%" stop-color="#080B14" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Shield Hologram Violet Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#22C7A5" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Chrome Border Stroke Gradient -->
    <linearGradient id="chromeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#A78BFA" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22C7A5" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="256" cy="256" r="140" fill="#8B5CF6" opacity="0.25" filter="url(#glow)"/>

  <!-- Holographic Glass Shield Outer -->
  <path d="M256 70 L410 135 V280 C410 375 256 445 256 445 C256 445 102 375 102 280 V135 Z"
        fill="url(#shieldGrad)"
        fill-opacity="0.2"
        stroke="url(#chromeStroke)"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Inner Glass Border -->
  <path d="M256 100 L380 155 V275 C380 350 256 412 256 412 C256 412 132 350 132 275 V155 Z"
        fill="none"
        stroke="rgba(255,255,255,0.25)"
        stroke-width="3"
        stroke-dasharray="8 6"/>

  <!-- Security Dial & Rings -->
  <circle cx="256" cy="270" r="68" fill="none" stroke="#22C7A5" stroke-width="6" stroke-linecap="round" stroke-dasharray="180 50" filter="url(#glow)"/>
  <circle cx="256" cy="270" r="48" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-dasharray="120 40"/>

  <!-- Safe Center Padlock Emblem -->
  <rect x="226" y="255" width="60" height="46" rx="10" fill="#FFFFFF" fill-opacity="0.95" />
  <path d="M236 255 V235 C236 222 244 214 256 214 C268 214 276 222 276 235 V255"
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="274" r="5" fill="#0F121E"/>
  <path d="M256 279 V288" stroke="#0F121E" stroke-width="4" stroke-linecap="round"/>

  <!-- Holographic Star Sparkles -->
  <path d="M370 120 Q370 140 390 140 Q370 140 370 160 Q370 140 350 140 Q370 140 370 120 Z" fill="#22C7A5" opacity="0.8"/>
  <path d="M140 340 Q140 355 155 355 Q140 355 140 370 Q140 355 125 355 Q140 355 140 340 Z" fill="#A78BFA" opacity="0.8"/>
</svg>
